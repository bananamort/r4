[package]
name = "r4"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A semantically-aware and control-flow tracking Lua analysis and transformation engine"
license = "MIT"
repository = "https://github.com/bananamort/r4"
readme = "README.md"

[features]
default = []
tracing = ["dep:tracing"]

[dependencies]
full_moon = { version = "2.2.0", features = ["roblox", "lua52", "lua53", "lua54", "luajit"] }
num-traits = "0.2.19"
bstr = "1.12.1"
indexmap = "2.14.0"
log = "0.4.29"
petgraph = "0.8.3"
serde = "1.0"
bitvec = "1.0"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
env_logger = "0.11.10"
pretty_assertions = "1.4.1"
insta = { version = "1.47.2", features = ["json", "filters"] }
paste = "1.0.15"
rand = "0.10.1"
rand_distr = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
darklua = "0.19.0"
lune = { version = "0.10.5", default-features = false, features = ["std-roblox"] }
mlua = { version = "0.11.6", features = ["luau"] }
async-io = "2.4"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pipeline"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
uninlined_format_args = "allow"

# full_moon can stack overflow on complex grammar if compiled with opt-level 0
[profile.dev.package.full_moon]
opt-level = 3
