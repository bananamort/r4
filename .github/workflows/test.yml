name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo test
        run: cargo test --workspace --all-targets

      - name: Run doc tests
        run: cargo test --workspace --doc

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Check on the declared MSRV
        run: cargo check --workspace --all-features

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    name: Measure coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Install coverage tooling
        run: |
          rustup component add llvm-tools-preview
          command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --locked

      - name: Measure coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --fail-under-lines 94

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  dialect-oracle:
    name: Dialect oracle (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [lua51, lua52, lua53, lua54, luajit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install ${{ matrix.dialect }}
        run: |
          sudo apt-get update -qq
          case "${{ matrix.dialect }}" in
            lua51) sudo apt-get install -y lua5.1 ;;
            lua52) sudo apt-get install -y lua5.2 ;;
            lua53) sudo apt-get install -y lua5.3 ;;
            lua54) sudo apt-get install -y lua5.4 ;;
            luajit) sudo apt-get install -y luajit ;;
          esac

      - name: Run the dialect oracle
        env:
          R4_LUA_DIALECTS: ${{ matrix.dialect }}
        run: cargo test --test luau_execution_oracle_test lua_dialects

  code-style:
    name: Verify code format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify code format
        run: cargo fmt -- --check
